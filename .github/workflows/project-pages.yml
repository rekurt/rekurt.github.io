name: Reusable project Pages

on:
  workflow_call:
    inputs:
      slug:
        description: Curated product slug from catalog/projects.yaml
        required: true
        type: string
    outputs:
      page_url:
        description: Deployed GitHub Pages URL
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v7
        with:
          path: project
      - name: Check out family kit
        uses: actions/checkout@v7
        with:
          repository: rekurt/rekurt.github.io
          ref: main
          path: family
      - uses: actions/setup-go@v7
        with:
          go-version-file: family/go.mod
          cache-dependency-path: family/go.sum
      - uses: actions/configure-pages@v6
      - name: Refresh public catalog
        working-directory: family
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/catalog-sync sync --manifest catalog/projects.yaml --snapshot site/src/data/generated/catalog.json --audit docs/repository-audit.md
      - name: Build project site
        working-directory: family
        run: >-
          go run ./cmd/project-site build
          --slug "${{ inputs.slug }}"
          --snapshot site/src/data/generated/catalog.json
          --repo ../project
          --out ../_site
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - name: Validate project site
        working-directory: family
        run: >-
          go run ./cmd/project-site validate
          --slug "${{ inputs.slug }}"
          --snapshot site/src/data/generated/catalog.json
          --repo ../project
          --out ../_site
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
