owner: rekurt
products:
  - slug: openkline
    primary_repo: rekurt/openkline
    repositories:
      - rekurt/openkline
      - rekurt/openkline-react
      - rekurt/openkline-vue
      - rekurt/openkline.tech
    kind: library
    domain: fintech
    accent: cyan
    featured: true
    maintained_fork: false
    upstream: ""
    summary:
      en: Candlestick charts with indicators and drawing tools for web applications, with React and Vue adapters.
      ru: Свечные графики с индикаторами и инструментами рисования для веб-приложений, с адаптерами React и Vue.
      zh-cn: 用于 Web 应用的 K 线图，提供指标、绘图工具及 React 和 Vue 适配器。
    install:
      - npm install @rekurt/openkline-core
    website: https://openkline.tech/
    documentation: https://rekurt.github.io/openkline/

  - slug: mac-coffee
    primary_repo: rekurt/Mac-Coffee
    repositories:
      - rekurt/Mac-Coffee
      - rekurt/homebrew-maccoffee
      - rekurt/maccoffee-dist
    kind: desktop
    domain: developer-tools
    accent: amber
    featured: true
    maintained_fork: true
    upstream: Elliotwu-7/Mac-Coffee
    summary:
      en: macOS menu bar app that prevents idle sleep, with a timer, low-battery cutoff and optional local MCP control.
      ru: Приложение строки меню macOS для отключения сна при бездействии, с таймером, остановкой при низком заряде и локальным MCP.
      zh-cn: macOS 菜单栏应用，可防止闲置休眠，支持定时结束、低电量停止及可选的本地 MCP 控制。
    install:
      - brew tap rekurt/maccoffee
      - brew install --cask maccoffee
    website: https://rekurt.github.io/Mac-Coffee/
    documentation: https://github.com/rekurt/Mac-Coffee#readme

  - slug: git-barber
    primary_repo: rekurt/git-barber
    repositories:
      - rekurt/git-barber
      - rekurt/homebrew-tap
    kind: cli
    domain: developer-tools
    accent: violet
    featured: true
    maintained_fork: false
    upstream: ""
    summary:
      en: Find branches merged through merge, squash or rebase, review their commits and confirm deletion in the terminal.
      ru: Поиск веток после merge, squash и rebase с просмотром коммитов и подтверждением удаления в терминале.
      zh-cn: 识别通过 merge、squash 或 rebase 合并的分支，在终端中检查提交并确认删除。
    install:
      - brew install rekurt/tap/git-barber
    website: https://rekurt.github.io/git-barber/
    documentation: https://github.com/rekurt/git-barber#readme

  - slug: vpn-hub
    primary_repo: rekurt/vpn-hub
    repositories:
