      ru: Подписи, хеширование, шифрование и согласование ключей по ГОСТ в Go через OpenSSL gost-engine.
      zh-cn: 基于 OpenSSL gost-engine，在 Go 中提供 GOST 签名、哈希、加密和密钥协商。
    install:
      - go get github.com/rekurt/gost-crypto
    website: https://rekurt.github.io/gost-crypto/
    documentation: https://pkg.go.dev/github.com/rekurt/gost-crypto

