    kind: library
    domain: fintech
    featured: true
    maintained_fork: false
    upstream: ""
    summary:
      en: Framework-agnostic OHLCV charting engine with indicators, drawing tools, and React and Vue adapters.
      ru: Независимый от фреймворка движок OHLCV-графиков с индикаторами, инструментами рисования и адаптерами React и Vue.
