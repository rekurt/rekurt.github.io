      ru: Go SDK для ботов Яндекс Мессенджера с типизированными сервисами сообщений, опросов и чатов, повторами и обработкой лимитов API.
      zh-cn: Yandex Messenger 机器人的 Go SDK，提供消息、投票和聊天的类型化服务，并处理重试与 API 限流。
    install:
      - go get github.com/rekurt/ymsdk
    website: https://rekurt.github.io/ymsdk/
    documentation: https://pkg.go.dev/github.com/rekurt/ymsdk

  - slug: gost-crypto
